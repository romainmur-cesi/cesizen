name: Laravel + Vue.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v3

      - name: Vérifier la structure
        run: ls -R

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: mbstring, bcmath, intl, pdo_mysql
          coverage: none

      - name: Installer Composer
        run: cd cesizen && composer install --no-progress --no-interaction --prefer-dist --optimize-autoloader

      - name: Copier le fichier .env
        run: cd cesizen && cp .env.example .env

      - name: Générer la clé de l'application
        run: php artisan key:generate

      - name: Attendre MySQL
        run: |
          until mysqladmin ping -h"127.0.0.1" -uroot -proot --silent; do
            echo "En attente de MySQL..."
            sleep 5
          done

      - name: Lancer les migrations
        run: cd cesizen && php artisan migrate --force

      - name: Lancer les tests Laravel
        run: cd cesizen && php artisan test

  vue-build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Installer les dépendances
        run: cd cesizen && npm install

      - name: Build du front Vue.js
        run: cd cesizen && npm run build
